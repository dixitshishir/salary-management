# Render Blueprint: one Docker web service on the free plan.
# The free plan has no persistent disk, so the SQLite database is recreated and
# re-seeded with the 10,000 demo employees whenever the service restarts.
services:
  - type: web
    name: acme-salary-manager
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /up
    envVars:
      - key: SECRET_KEY_BASE
        generateValue: true
